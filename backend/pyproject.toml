[project]
name = "server-load-predictor-api"
version = "0.1.0"
description = "Forecasts server cluster load and recommends scaling actions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.53",
    "statsmodels>=0.15.0",
    "uvicorn[standard]>=0.53.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
