services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SLP_SIM_TICK_SECONDS: "5"
    volumes:
      - api-data:/app/data
      - api-artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 240s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
  api-artifacts:
